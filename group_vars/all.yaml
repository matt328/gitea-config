# Group variables for gitea-config
#
# This file contains default values for all configuration options.
# To override any values for your environment, create a file named:
#   group_vars/all.local.yaml
#
# See group_vars/all.local.example.yaml for a template with all available options.

# ============================================================================
# Gitea Configuration (Defaults)
# ============================================================================
gitea_image: "docker.io/gitea/gitea:latest"
gitea_root_url: "https://git.lab.teeter.dev"
gitea_ssh_domain: "git.lab.teeter.dev"
gitea_ssh_port: 22
gitea_actions_enabled: true
gitea_publish_ports:
  - "3000:3000"
gitea_volumes:
  - "/var/lib/gitea:/data:Z"
gitea_network: "homelab_net"
gitea_auto_update: "registry"
gitea_after_service: ""

# ============================================================================
# Nginx Proxy Manager Configuration (Defaults)
# ============================================================================
npm_image: "docker.io/jc21/nginx-proxy-manager:latest"
npm_publish_ports:
  - "80:80"
  - "443:443"
  - "22:22"
  - "81:81"
npm_volumes:
  - "/var/lib/npm/data:/data:Z"
  - "/var/lib/npm/letsencrypt:/etc/letsencrypt:Z"
npm_network: "homelab_net"
npm_auto_update: "registry"
npm_after_service: "gitea.service"
npm_wants_service: "gitea.service"

# ============================================================================
# Backup Configuration (Defaults)
# ============================================================================
backup_dir: "/mnt/backups"
backup_limit_gb: 20

# ============================================================================
# Open-WebUI Configuration (Defaults)
# ============================================================================
openwebui_image: "ghcr.io/open-webui/open-webui:main"
openwebui_publish_ports:
  - "8080:8080"
openwebui_volumes:
  - "open-webui-data:/app/backend/data"
openwebui_network: "homelab_net"
openwebui_after_service: ""
